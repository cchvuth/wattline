# On every push to master: analyze and the tests, and both APKs built side by
# side, then a pre-release with the APKs once all three pass.
name: APK

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write # the release

# macOS for the tests and builds: the layout tests load the Mac's own fonts
# (test/flutter_test_config.dart), and Linux, falling back to Ahem, overflows.
jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  build:
    runs-on: macos-latest
    strategy:
      matrix:
        include:
          # Most phones (64-bit ARM): the small one.
          - name: Tesla-Dash-Android.apk
            args: --split-per-abi --target-platform android-arm64
            out: app-arm64-v8a-release.apk
          # Every phone, older 32-bit ones too.
          - name: Tesla-Dash-Android-older-phones.apk
            args: ''
            out: app-release.apk
    env:
      # Release builds are signed with the debug key. With the Mac's key here
      # (base64 of ~/.android/debug.keystore), the APK installs over a local
      # build and keeps the app's settings; without it, CI's own key.
      DEBUG_KEYSTORE: ${{ secrets.DEBUG_KEYSTORE }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - name: Signing key
        if: env.DEBUG_KEYSTORE != ''
        run: mkdir -p ~/.android && echo "$DEBUG_KEYSTORE" | base64 -d > ~/.android/debug.keystore
      - run: flutter build apk --release ${{ matrix.args }}
      - run: mv "build/app/outputs/flutter-apk/${{ matrix.out }}" "${{ matrix.name }}"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.name }}

  release:
    needs: [test, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
      - name: Short commit
        run: echo "SHORT=${GITHUB_SHA::7}" >> "$GITHUB_ENV"
      # A pre-release per push: open it on the phone and tap the APK.
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }} (${{ env.SHORT }})
          target_commitish: ${{ github.sha }}
          prerelease: true
          generate_release_notes: true
          files: Tesla-Dash-Android*.apk
