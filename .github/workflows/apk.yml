# On every push to master: analyze and the tests, and both APKs built side by
# side, then a pre-release with the APKs once all three pass. A version tag
# (v1.0.0) does the same as a full release under its own name.
name: APK

on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write # the release

# A newer push to master replaces a run still going; a version tag's run
# always finishes.
concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

# macOS for the tests and builds: the layout tests load the Mac's own fonts
# (test/flutter_test_config.dart), and Linux, falling back to Ahem, overflows.
jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      # A version tag must match the pubspec's version, or installed phones
      # would offer the same "update" forever.
      - if: github.ref_type == 'tag'
        run: grep -q "^version: ${GITHUB_REF_NAME#v}+" pubspec.yaml
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  build:
    runs-on: macos-latest
    strategy:
      matrix:
        include:
          # Most phones (64-bit ARM): the small one.
          - name: Wattline-Android.apk
            args: --split-per-abi --target-platform android-arm64
            out: app-arm64-v8a-release.apk
          # Every phone, older 32-bit ones too.
          - name: Wattline-Android-older-phones.apk
            args: ''
            out: app-release.apk
    env:
      # Release builds are signed with the debug key. With the Mac's key here
      # (base64 of ~/.android/debug.keystore), the APK installs over a local
      # build and keeps the app's settings; without it, CI's own key.
      DEBUG_KEYSTORE: ${{ secrets.DEBUG_KEYSTORE }}
    steps:
      - uses: actions/checkout@v7
      # The runner's own Java 17: setup-java's download (Adoptium) kept failing
      # with 502/504 and sank the 1.0.2 and 1.0.3 builds.
      - run: echo "JAVA_HOME=$JAVA_HOME_17_arm64" >> "$GITHUB_ENV"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      # Gradle and what it fetches (the Android plugin, the Kotlin compiler,
      # Flutter's engine) from the Actions cache, which master's runs save and
      # tag runs read: downloaded from GitHub on every run, GitHub's 504s sank
      # the 1.0.6 build. The open-source (MIT) provider, not the default one.
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - name: Signing key
        if: env.DEBUG_KEYSTORE != ''
        run: mkdir -p ~/.android && echo "$DEBUG_KEYSTORE" | base64 -d > ~/.android/debug.keystore
      - run: flutter build apk --release ${{ matrix.args }}
      - run: mv "build/app/outputs/flutter-apk/${{ matrix.out }}" "${{ matrix.name }}"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.name }}

  release:
    needs: [test, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
      - name: Short commit
        run: echo "SHORT=${GITHUB_SHA::7}" >> "$GITHUB_ENV"
      # A pre-release per push, a release per version tag: open it on the
      # phone and tap the APK.
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('build-{0}', github.run_number) }}
          name: ${{ github.ref_type == 'tag' && format('Wattline {0}', github.ref_name) || format('Build {0} ({1})', github.run_number, env.SHORT) }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ github.ref_type != 'tag' }}
          make_latest: ${{ github.ref_type == 'tag' }}
          generate_release_notes: true
          files: Wattline-Android*.apk
