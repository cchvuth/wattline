# Builds the APKs on every push to master, after analyze and the tests, and
# publishes them as a pre-release (and the run's artifact).
name: APK

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write # the release

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Release builds are signed with the debug key. With the Mac's key here
      # (base64 of ~/.android/debug.keystore), this APK installs over a local
      # build and keeps the app's settings; without it, CI's own key.
      DEBUG_KEYSTORE: ${{ secrets.DEBUG_KEYSTORE }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - name: Signing key
        if: env.DEBUG_KEYSTORE != ''
        run: mkdir -p ~/.android && echo "$DEBUG_KEYSTORE" | base64 -d > ~/.android/debug.keystore
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --release --split-per-abi --target-platform android-arm64
      - run: flutter build apk --release # all ABIs, for phones that are not arm64
      - name: Name the APKs
        run: |
          short=$(git rev-parse --short HEAD)
          echo "SHORT=$short" >> "$GITHUB_ENV"
          cd build/app/outputs/flutter-apk
          mv app-arm64-v8a-release.apk "tesla-dash-$short-arm64.apk"
          mv app-release.apk "tesla-dash-$short-universal.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: tesla-dash-${{ env.SHORT }}
          path: build/app/outputs/flutter-apk/tesla-dash-*.apk
      # A pre-release per push, with both APKs: download one on the phone and
      # install it.
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }} (${{ env.SHORT }})
          target_commitish: ${{ github.sha }}
          prerelease: true
          generate_release_notes: true
          files: build/app/outputs/flutter-apk/tesla-dash-*.apk
