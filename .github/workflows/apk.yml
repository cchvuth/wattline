# A version tag (v1.0.0): analyze and the tests, both APKs built side by
# side, then the release under its name once all three pass. Run by hand
# (Actions, Run workflow): the same checks and APKs, kept as the run's
# artifacts, no release.
name: APK

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write # the release

# A version tag's run always finishes; a run by hand gives way to a newer one.
concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

# macOS for the tests and builds: the layout tests load the Mac's own fonts
# (test/flutter_test_config.dart), and Linux, falling back to Ahem, overflows.
jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      # A version tag must match the pubspec's version, or installed phones
      # would offer the same "update" forever.
      - if: github.ref_type == 'tag'
        run: |
          grep -q "^version: ${GITHUB_REF_NAME#v}+" pubspec.yaml
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  build:
    runs-on: macos-latest
    strategy:
      matrix:
        include:
          # Most phones (64-bit ARM): the small one.
          - name: Wattline-Android.apk
            args: --split-per-abi --target-platform android-arm64
            out: app-arm64-v8a-release.apk
          # Every phone, older 32-bit ones too.
          - name: Wattline-Android-older-phones.apk
            args: ''
            out: app-release.apk
    env:
      # Release builds are signed with the debug key. With the Mac's key here
      # (base64 of ~/.android/debug.keystore), the APK installs over a local
      # build and keeps the app's settings; without it, CI's own key.
      DEBUG_KEYSTORE: ${{ secrets.DEBUG_KEYSTORE }}
    steps:
      - uses: actions/checkout@v7
      # The runner's own Java 17: setup-java's download (Adoptium) kept failing
      # with 502/504 and sank the 1.0.2 and 1.0.3 builds.
      - run: echo "JAVA_HOME=$JAVA_HOME_17_arm64" >> "$GITHUB_ENV"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      # Gradle and what it fetches (the Android plugin, the Kotlin compiler,
      # Flutter's engine) from the Actions cache: downloaded from GitHub on
      # every run, GitHub's 504s sank the 1.0.6 build. Only a run on master
      # (by hand) saves it; tag runs read it, and it lapses after 7 days
      # unused. The open-source (MIT) provider, not the default one.
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - name: Signing key
        if: env.DEBUG_KEYSTORE != ''
        run: mkdir -p ~/.android && echo "$DEBUG_KEYSTORE" | base64 -d > ~/.android/debug.keystore
      - run: flutter build apk --release ${{ matrix.args }}
      - run: mv "build/app/outputs/flutter-apk/${{ matrix.out }}" "${{ matrix.name }}"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.name }}

  release:
    needs: [test, build]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
      # The release, the APKs on it: open it on the phone and tap one.
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: Wattline ${{ github.ref_name }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          generate_release_notes: true
          files: Wattline-Android*.apk
