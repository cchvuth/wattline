# Builds the phone's APK (arm64) on every push to master, after analyze and
# the tests; the APK is the run's artifact.
name: APK

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Release builds are signed with the debug key. With the Mac's key here
      # (base64 of ~/.android/debug.keystore), this APK installs over a local
      # build and keeps the app's settings; without it, CI's own key.
      DEBUG_KEYSTORE: ${{ secrets.DEBUG_KEYSTORE }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - name: Signing key
        if: env.DEBUG_KEYSTORE != ''
        run: mkdir -p ~/.android && echo "$DEBUG_KEYSTORE" | base64 -d > ~/.android/debug.keystore
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --release --split-per-abi --target-platform android-arm64
      - uses: actions/upload-artifact@v4
        with:
          name: tesla-dash-${{ github.sha }}
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
